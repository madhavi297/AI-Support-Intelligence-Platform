services:
  # FastAPI REST API Backend
  - type: web
    name: ai-support-intelligence-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/train_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_MODE
        value: tfidf
      - key: SIMILARITY_THRESHOLD
        value: "0.1"
      - key: TOP_K_RETRIEVAL
        value: "3"
